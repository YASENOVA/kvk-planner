# Deployment blueprint for Render.
#
# Render only reads this file when it sits at the very top of the repository.
# The application itself lives one level down in kvk-tool/, so rootDir points
# Render at that folder. The Dockerfile is found inside it automatically -
# spelling out dockerfilePath here would be resolved from the repository root
# instead and point at the wrong place.
#
# Without the persistent disk below, the SQLite database would live on a
# throwaway filesystem and every deploy or restart would silently wipe every
# submission.

services:
  - type: web
    name: kvk-planner
    runtime: docker
    # Quoted because the folder name contains a space: macOS appended the "2"
    # when unzipping next to an existing kvk-tool folder, and that name is what
    # actually landed in the repository.
    rootDir: "kvk-tool 2"
    plan: starter
    region: frankfurt

    disk:
      name: planner-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # Signs session cookies and CSRF tokens. Render generates it once and
      # keeps it; changing it later just logs everyone out.
      - key: SECRET_KEY
        generateValue: true

      # Opens the cross-event overview at /superadmin?secret=...
      - key: SUPERADMIN_SECRET
        generateValue: true

      - key: DATABASE_PATH
        value: /app/data/planner.db

      # Cookies over HTTPS only. Render terminates TLS, so this is safe here.
      - key: SESSION_COOKIE_SECURE
        value: "true"

      - key: ENABLE_SCREENSHOT_UPLOAD
        value: "false"
