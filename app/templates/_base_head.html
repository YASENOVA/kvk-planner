/* kvk-gold is the one accent colour. The token kept its old name so that a
   few hundred class attributes did not have to change; the value is the
   neon blue. Change it here and the whole tool follows. */

 'kvk-gold':'#00c8ff','kvk-blue':'#7df3ff',
 'kvk-gray':{700:'#16202e',800:'#0b1017',900:'#05070d'}}}}}
</script>
