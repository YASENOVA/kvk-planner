<!DOCTYPE html>
<html lang="en" class="dark"><head>{% include '_base_head.html' %}
<title>Event created - KvK Planner</title></head>
<body class="bg-kvk-gray-900 text-gray-200 antialiased">
<div class="container mx-auto p-4 md:p-8 max-w-3xl">
  <h1 class="text-3xl font-bold text-kvk-gold mb-1">Event created</h1>
  <p class="text-gray-400 mb-6">
    Save the links marked <span class="text-red-400 font-semibold">admin key</span> now — they cannot be recovered.
  </p>
  {% for title, note, url, is_admin in links %}
  <div class="bg-kvk-gray-800 p-5 rounded-xl border {% if is_admin %}border-red-900{% else %}border-kvk-gray-700{% endif %} mb-4">
    <div class="flex items-baseline justify-between mb-1">
      <h2 class="text-lg font-bold text-gray-100">{{ loop.index }}. {{ title }}</h2>
      {% if is_admin %}<span class="text-xs font-bold text-red-400 uppercase tracking-wide">admin key</span>{% endif %}
    </div>
    <p class="text-sm text-gray-400 mb-3">{{ note }}</p>
    <input type="text" readonly value="{{ url }}" onclick="this.select();"
           class="block w-full bg-kvk-gray-900 border border-kvk-gray-700 rounded-md px-3 py-2 text-sm text-gray-200">
  </div>
  {% endfor %}
</div></body></html>
