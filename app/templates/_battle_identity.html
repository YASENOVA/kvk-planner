        <!-- Your Information -->
        <section class="bg-kvk-gray-800 rounded-xl p-5 mb-5 border border-kvk-gray-700">
            <div class="subh mb-1">Your information</div>
            <p class="subh-sub mb-4">Who you are in game.</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="block">
                    <span class="text-sm text-gray-300">Player Name</span>
                    <input type="text" name="player_name" required maxlength="40" placeholder="e.g. YASENOVA"
                           value="{{ form.player_name if form else '' }}"
                           class="field mt-1">
                </label>

                <label class="block">
                    <span class="text-sm text-gray-300">Player ID (Numeric)</span>
                    <input type="text" name="player_id" required inputmode="numeric" pattern="\d*" placeholder="e.g. 188755088"
                           value="{{ form.player_id if form else '' }}"
                           class="field mt-1">
                </label>
            </div>

            <label class="block mt-4">
                <span class="text-sm text-gray-300">Alliance</span>
                {% if event.cfg.alliances %}
                <select name="alliance_name" required class="field mt-1">
                    <option value="">Select...</option>
                    {% for a in event.cfg.alliances %}
                    <option value="{{ a }}" {% if form and form.alliance_name == a %}selected{% endif %}>{{ a }}</option>
                    {% endfor %}
                </select>
                {% else %}
                <input type="text" name="alliance_name" maxlength="40"
                       value="{{ form.alliance_name if form else '' }}" class="field mt-1">
                {% endif %}
            </label>
        </section>
