<style>
:root{
  --ink:#05070d; --panel:#0b1017; --line:#16202e; --line-hi:#2f4259;
  --neon:#00c8ff; --neon-soft:#7df3ff; --neon-fill:#042733;
  --fg:#eaf7ff; --fg-2:#9fb0c0; --fg-3:#4a5768;
}
body{background:var(--ink);color:var(--fg);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:.02em}
/* Numbers line up in columns only if the digits are the same width. */
.mono,table td.cell,.tabnum{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
/* The small all-caps labels that hold the layout together. */
.eyebrow{font-size:.62rem;letter-spacing:.17em;text-transform:uppercase;color:var(--neon)}
.rule{height:1px;background:var(--line);border:0}
a{color:var(--neon-soft)}
a:hover{color:var(--neon)}
::selection{background:var(--neon);color:var(--ink)}
input,select,textarea{font-family:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:none;box-shadow:0 0 0 2px var(--neon)}
input[type=checkbox],input[type=radio]{accent-color:var(--neon)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--line-hi)}
</style>
<style>
/* Section headings: a number, the title in caps, and a rule that runs out
   of it. The rule is what makes a heading look placed rather than typed. */
.sect{display:flex;align-items:center;gap:.7rem}
.sect-num{width:1.65rem;height:1.65rem;flex:none;border-radius:4px;
  background:var(--neon-fill);border:1px solid var(--neon);color:var(--neon-soft);
  font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.sect-title{font-size:1.02rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--fg);white-space:nowrap}
.sect-line{flex:1;height:1px;min-width:1rem;
  background:linear-gradient(90deg,var(--neon),rgba(0,200,255,0))}
.sect-sub{font-size:.78rem;color:var(--fg-2);margin-top:.45rem}

/* Sub-headings inside a section: smaller, accent coloured, with a tick. */
.subh{display:flex;align-items:center;gap:.5rem;font-size:.82rem;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--neon)}
.subh::before{content:"";width:3px;height:.85rem;background:var(--neon);flex:none}
.subh-sub{font-size:.78rem;color:var(--fg-2);margin-top:.35rem}
</style>
